trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.11'

stages:
- stage: BuildAndTest
  displayName: 'Build, lint, test, publish artefact'
  jobs:
  - job: Build
    displayName: 'Run lint and tests'
    steps:
    - task: UsePythonVersion@0
      displayName: 'Use Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'
        addToPath: true

    - script: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
      displayName: 'Install dependencies'

    - script: |
        python -m pylint --disable=R0801 calculator main.py app.py
      displayName: 'Run pylint'

    - script: |
        echo "Running tests with pytest and coverage"
        python -m pytest -q \
          --junitxml=junit.xml \
          --cov=calculator \
          --cov-branch \
          --cov-report=xml:coverage.xml \
          --cov-report=html:htmlcov \
          --cov-fail-under=80
      displayName: 'Test + coverage (fails if <80%)'
      condition: succeededOrFailed()

    - task: PublishTestResults@2
      displayName: 'Publish test results (JUnit)'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'junit.xml'
        failTaskOnFailedTests: true

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish code coverage (Cobertura XML)'
      condition: succeededOrFailed()
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
        reportDirectory: '$(System.DefaultWorkingDirectory)/htmlcov'
        failIfCoverageEmpty: true

    # package app as artefact
    - task: CopyFiles@2
      displayName: 'Copy files to artefact staging'
      inputs:
        contents: |
          calculator/**
          templates/**
          app.py
          main.py
          requirements.txt
        targetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish build artefact'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'drop'
        publishLocation: 'Container'

- stage: SecurityTests
  displayName: 'Security testing'
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
  - job: Security
    displayName: 'Run security scans'
    steps:
    - task: UsePythonVersion@0
      displayName: 'Use Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'
        addToPath: true

    - script: |
        python -m pip install --upgrade pip
        python -m pip install pip-audit
      displayName: 'Install security tools'

    - script: |
        echo "Running dependency vulnerability scan..."
        pip-audit
      displayName: 'Dependency vulnerability scan (pip-audit)'

    - script: |
        echo "Running secret scan with Gitleaks..."
        docker run --rm \
          -v "$(System.DefaultWorkingDirectory):/repo" \
          zricethezav/gitleaks:latest detect \
          --source=/repo \
          --no-git \
          --verbose
      displayName: 'Secret scanning (Gitleaks)'

# deploy to test
- stage: Deploy_Test
  displayName: 'Deploy to Test environment'
  dependsOn: BuildAndTest
  condition: succeeded()   # only if build stage succeeded
  jobs:
  - deployment: DeployToTest
    displayName: 'Deploy calculator to Test (simulated)'
    environment: 'Test'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: UsePythonVersion@0
            displayName: 'Use Python $(pythonVersion)'
            inputs:
              versionSpec: '$(pythonVersion)'
              addToPath: true

          - script: |
              python -m pip install --upgrade pip
              python -m pip install -r $(Pipeline.Workspace)/drop/requirements.txt
            displayName: 'Install dependencies in deployment job'

          - script: |
              echo "Starting Flask app in background..."
              cd $(Pipeline.Workspace)/drop
              python app.py &
              APP_PID=$!
              echo "App PID: $APP_PID"

              # Give the app a moment to start
              sleep 5

              echo "Hitting smoke-test endpoint..."
              curl -f "http://127.0.0.1:8000/api/calculate?op=add&a=1&b=2"

              echo "Stopping app..."
              kill $APP_PID || true
            displayName: 'Smoke test deployment on Test'

- stage: PerformanceTests
  displayName: 'Performance tests (JMeter)'
  dependsOn: Deploy_Test
  condition: succeeded()
  jobs:
  - job: JMeter
    displayName: 'Run JMeter load tests'
    steps:
    - task: UsePythonVersion@0
      displayName: 'Use Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'
        addToPath: true

    - script: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
      displayName: 'Install app dependencies'

    - script: |
        echo "Downloading JMeter..."
        JMETER_VERSION=5.6.3
        wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz -O apache-jmeter.tgz
        tar -xzf apache-jmeter.tgz
      displayName: 'Download and extract JMeter'

    - script: |
        echo "Starting Flask app in background..."
        python app.py &
        APP_PID=$!
        echo "App PID: $APP_PID"
        sleep 5

        echo "Running JMeter test plan..."
        ./apache-jmeter-*/bin/jmeter \
          -n \
          -t performance-tests/calculator_load_test.jmx \
          -l jmeter-results.jtl \
          -e -o jmeter-report

        echo "Stopping app..."
        kill $APP_PID || true
      displayName: 'Run JMeter against local app'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish JMeter HTML report'
      inputs:
        pathToPublish: '$(System.DefaultWorkingDirectory)/jmeter-report'
        artifactName: 'jmeter-report'
        publishLocation: 'Container'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish JMeter raw results'
      inputs:
        pathToPublish: '$(System.DefaultWorkingDirectory)/jmeter-results.jtl'
        artifactName: 'jmeter-results'
        publishLocation: 'Container'

- stage: UATTests
  displayName: 'UAT tests (Behave + Selenium)'
  dependsOn: PerformanceTests
  condition: succeeded()
  jobs:
  - job: BehaveUAT
    displayName: 'Run Behave UI tests'
    steps:
    - task: UsePythonVersion@0
      displayName: 'Use Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'
        addToPath: true

    - script: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
      displayName: 'Install UAT dependencies'

    - script: |
        set +e

        echo "Starting Flask app for UAT..."
        python app.py &
        APP_PID=$!
        sleep 5

        echo "Running Behave UAT tests..."
        mkdir -p uat/screenshots

        behave uat/features | tee uat/behave-output.txt
        BEHAVE_EXIT=${PIPESTATUS[0]}

        echo "Stopping Flask app..."
        kill $APP_PID || true

        echo "Behave exit code: $BEHAVE_EXIT"
        exit $BEHAVE_EXIT
      displayName: 'Run Behave scenarios with evidence'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish UAT evidence'
      condition: succeededOrFailed()
      inputs:
        pathToPublish: 'uat'
        artifactName: 'uat-evidence'
        publishLocation: 'Container'