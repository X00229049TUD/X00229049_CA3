trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: "3.11"

stages:
- stage: BuildAndTest
  displayName: "Build, lint, test, coverage, publish artifact"
  jobs:
    - job: Build
      displayName: "Build & quality gates"
      steps:
        - task: UsePythonVersion@0
          displayName: "Use Python $(pythonVersion)"
          inputs:
            versionSpec: "$(pythonVersion)"
            addToPath: true

        - script: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          displayName: "Install dependencies"

        - script: |
            python -m pylint --disable=R0801 calculator main.py app.py
          displayName: "Run pylint"

        - script: |
            echo "Running tests with pytest and coverage"
            python -m pytest -q \
              --junitxml=junit.xml \
              --cov=calculator \
              --cov-branch \
              --cov-report=xml:coverage.xml \
              --cov-report=html:htmlcov \
              --cov-fail-under=80
          displayName: "Test + coverage (fails if <80%)"

        - task: PublishTestResults@2
          displayName: "Publish test results (JUnit)"
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: "JUnit"
            testResultsFiles: "junit.xml"
            failTaskOnFailedTests: true

        - task: PublishCodeCoverageResults@2
          displayName: "Publish code coverage (Cobertura XML)"
          condition: succeededOrFailed()
          inputs:
            codeCoverageTool: "Cobertura"
            summaryFileLocation: "$(System.DefaultWorkingDirectory)/coverage.xml"
            reportDirectory: "$(System.DefaultWorkingDirectory)/htmlcov"
            failIfCoverageEmpty: true

        - task: CopyFiles@2
          displayName: "Copy files to artifact staging"
          inputs:
            contents: |
              calculator/**
              templates/**
              performance-tests/**
              uat/**
              app.py
              main.py
              requirements.txt
            targetFolder: "$(Build.ArtifactStagingDirectory)"

        - task: PublishBuildArtifacts@1
          displayName: "Publish build artifact (drop)"
          inputs:
            pathToPublish: "$(Build.ArtifactStagingDirectory)"
            artifactName: "drop"
            publishLocation: "Container"


- stage: SecretScanning
  displayName: "SEC - Secret scanning"
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
    - job: Gitleaks
      displayName: "Gitleaks scan"
      steps:
        - script: |
            set -e
            echo "Installing Gitleaks..."
            GITLEAKS_VERSION=8.18.4

            curl -sSL \
              https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz \
              -o gitleaks.tar.gz

            tar -xzf gitleaks.tar.gz
            chmod +x gitleaks
            sudo mv gitleaks /usr/local/bin/gitleaks

            gitleaks version
          displayName: 'Install Gitleaks'

        - script: |
            echo "Running Gitleaks scan..."
            gitleaks detect \
              --source . \
              --no-git \
              --redact \
              --verbose \
              -- config \
              .gitleaks.toml
          displayName: 'Run Gitleaks secret scan'


- stage: DependencySecurity
  displayName: "DS - Dependency vulnerability scan"
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
    - job: PipAudit
      displayName: "pip-audit scan"
      steps:
        - task: UsePythonVersion@0
          displayName: "Use Python $(pythonVersion)"
          inputs:
            versionSpec: "$(pythonVersion)"
            addToPath: true

        - script: |
            python -m pip install --upgrade pip
            python -m pip install pip-audit
          displayName: "Install pip-audit"

        - script: |
            pip-audit -r requirements.txt
          displayName: "Run pip-audit"


- stage: Deploy_Test
  displayName: "Deploy to Test environment"
  dependsOn:
    - BuildAndTest
    - SecretScanning
    - DependencySecurity
  condition: succeeded()
  jobs:
    - deployment: DeployToTest
      displayName: "Deploy calculator to Test (simulated + smoke test)"
      environment: "Test"
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: drop

              - task: UsePythonVersion@0
                displayName: "Use Python $(pythonVersion)"
                inputs:
                  versionSpec: "$(pythonVersion)"
                  addToPath: true

              - script: |
                  python -m pip install --upgrade pip
                  python -m pip install -r $(Pipeline.Workspace)/drop/requirements.txt
                displayName: "Install dependencies from artifact"

              - script: |
                  set -euxo pipefail
                  cd $(Pipeline.Workspace)/drop

                  echo "Starting Flask app..."
                  python app.py &
                  APP_PID=$!
                  sleep 5

                  echo "Smoke test..."
                  curl -f "http://127.0.0.1:8000/api/calculate?op=add&a=1&b=2"

                  echo "Stopping app..."
                  kill $APP_PID || true
                displayName: "Smoke test deployment on Test"


- stage: PerformanceTests
  displayName: "Performance tests (JMeter)"
  dependsOn: Deploy_Test
  condition: succeeded()
  jobs:
    - job: JMeter
      displayName: "Run JMeter load tests"
      steps:
        - download: current
          artifact: drop

        - task: UsePythonVersion@0
          displayName: "Use Python $(pythonVersion)"
          inputs:
            versionSpec: "$(pythonVersion)"
            addToPath: true

        - script: |
            python -m pip install --upgrade pip
            python -m pip install -r $(Pipeline.Workspace)/drop/requirements.txt
          displayName: "Install app deps from artifact"

        - script: |
            set -euxo pipefail
            cd $(Pipeline.Workspace)/drop

            echo "Downloading JMeter..."
            JMETER_VERSION=5.6.3
            wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz -O apache-jmeter.tgz
            tar -xzf apache-jmeter.tgz

            echo "Starting Flask app..."
            python app.py &
            APP_PID=$!
            sleep 5

            echo "Run JMeter plan..."
            ./apache-jmeter-*/bin/jmeter \
              -n \
              -t performance-tests/calculator_load_test.jmx \
              -l jmeter-results.jtl \
              -e -o jmeter-report

            echo "Stop Flask app..."
            kill $APP_PID || true
          displayName: "Run JMeter against local app"

        - task: PublishBuildArtifacts@1
          displayName: "Publish JMeter HTML report"
          inputs:
            pathToPublish: "$(Pipeline.Workspace)/drop/jmeter-report"
            artifactName: "jmeter-report"
            publishLocation: "Container"

        - task: PublishBuildArtifacts@1
          displayName: "Publish JMeter raw results"
          inputs:
            pathToPublish: "$(Pipeline.Workspace)/drop/jmeter-results.jtl"
            artifactName: "jmeter-results"
            publishLocation: "Container"


- stage: UATTests
  displayName: "UAT tests (Behave + Selenium)"
  dependsOn: PerformanceTests
  condition: succeeded()
  jobs:
    - job: BehaveUAT
      displayName: "Run Behave UI tests"
      steps:
        - download: current
          artifact: drop

        - task: UsePythonVersion@0
          displayName: "Use Python $(pythonVersion)"
          inputs:
            versionSpec: "$(pythonVersion)"
            addToPath: true

        - script: |
            python -m pip install --upgrade pip
            python -m pip install -r $(Pipeline.Workspace)/drop/requirements.txt
          displayName: "Install UAT dependencies from artifact"

        - script: |
            set +e
            cd $(Pipeline.Workspace)/drop

            echo "Starting Flask app for UAT..."
            python app.py &
            APP_PID=$!
            sleep 5

            mkdir -p uat/screenshots

            echo "Running Behave..."
            behave uat/features | tee uat/behave-output.txt
            BEHAVE_EXIT=${PIPESTATUS[0]}

            echo "Stopping Flask..."
            kill $APP_PID || true

            echo "Behave exit code: $BEHAVE_EXIT"
            exit $BEHAVE_EXIT
          displayName: "Run Behave scenarios with evidence"

        - task: PublishBuildArtifacts@1
          displayName: "Publish UAT evidence"
          condition: succeededOrFailed()
          inputs:
            pathToPublish: "$(Pipeline.Workspace)/drop/uat"
            artifactName: "uat-evidence"
            publishLocation: "Container"


- stage: Deploy_Prod
  displayName: "Deploy to Production"
  dependsOn: UATTests
  condition: succeeded()
  jobs:
    - deployment: DeployToProd
      displayName: "Deploy calculator to Production (simulated + verification)"
      environment: "Production"
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: drop

              - task: UsePythonVersion@0
                displayName: "Use Python $(pythonVersion)"
                inputs:
                  versionSpec: "$(pythonVersion)"
                  addToPath: true

              - script: |
                  python -m pip install --upgrade pip
                  python -m pip install -r $(Pipeline.Workspace)/drop/requirements.txt
                displayName: "Install production dependencies"

              - script: |
                  set -euxo pipefail
                  cd $(Pipeline.Workspace)/drop

                  echo "Starting app..."
                  python app.py &
                  APP_PID=$!
                  sleep 5

                  echo "Production verification..."
                  curl -f "http://127.0.0.1:8000/api/calculate?op=add&a=2&b=3"

                  echo "Stopping app..."
                  kill $APP_PID || true
                displayName: "Production verification"
